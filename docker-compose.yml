services:
  opencodesilver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencodesilver
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/opencodesilver:/home/opencodesilver/.config/opencodesilver
      - ./data/opencode/share:/home/opencodesilver/.local/share/opencode
      - ./data/opencode/state:/home/opencodesilver/.local/state/opencode
      - ./data/opencode/config:/home/opencodesilver/.config/opencode
      - ./data/ssh:/home/opencodesilver/.ssh
      - ./workspaces:/home/opencodesilver/workspaces
    environment:
      # Docker binds OpencodeSilver to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   OPENCODESILVER_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      OPENCODESILVER_UI_PASSWORD: ${OPENCODESILVER_UI_PASSWORD:?Set OPENCODESILVER_UI_PASSWORD before exposing OpencodeSilver through Docker}
    # OPENCODESILVER_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # OPENCODESILVER_TUNNEL_PROVIDER: cloudflare
    # OPENCODESILVER_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # OPENCODESILVER_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # OPENCODESILVER_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # OPENCODESILVER_TUNNEL_CONFIG: /home/opencodesilver/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # OPENCODESILVER_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
