name: Release OpencodeSilver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v2.9.0)'
        required: false
        default: 'v2.9.0'

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  release-macos:
    name: Build & Release macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple Silicon (M1/M2/M3/M4)
          - arch: x64
            label: Intel (x64)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build Web and UI
        run: |
          bun run build:web
          bun run build:ui

      - name: Package macOS Desktop Application (${{ matrix.arch }})
        run: |
          bun run electron:build
        env:
          OPENCODESILVER_TARGET_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish macOS Release Assets (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            packages/electron/dist/*-mac-${{ matrix.arch }}.dmg
            packages/electron/dist/*-mac-${{ matrix.arch }}.dmg.blockmap
            packages/electron/dist/*-mac-${{ matrix.arch }}.zip
            packages/electron/dist/*-mac-${{ matrix.arch }}.zip.blockmap
            packages/electron/dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Mobile Web Assets & Sync Capacitor Android
        working-directory: packages/mobile
        run: |
          bun run build:assets
          bunx cap sync android

      - name: Build Android APK
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../../OpencodeSilver-2.9.0-android.apk
        env:
          OPENCODESILVER_ANDROID_VERSION_NAME: '2.9.0'
          OPENCODESILVER_ANDROID_VERSION_CODE: '290'

      - name: Publish Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            OpencodeSilver-2.9.0-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    name: Build & Release Windows Desktop & VS Code Extension
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build Web, UI & VS Code Extension
        run: |
          bun run build:web
          bun run build:ui
          bun run --cwd packages/vscode package

      - name: Package Windows Desktop Electron Application
        run: |
          bun run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Windows & VS Code Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.exe.blockmap
            packages/electron/dist/latest.yml
            packages/vscode/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
