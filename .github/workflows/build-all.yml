name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BUN_VERSION: '1.4.2'

jobs:
  # -------------------------------------------------------------
  # 1. VS Code Extension (.vsix)
  # -------------------------------------------------------------
  build-vscode:
    name: Build VS Code Extension (.vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and dependencies
        run: bun run build:deps

      - name: Build Core Engine
        run: bun run --cwd packages/core build

      - name: Build web extension assets
        run: bun run --cwd packages/vscode build

      - name: Package VSIX
        run: |
          npx --yes @vscode/vsce package --no-dependencies --out packages/vscode/
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeSilver-VSCode-Extension
          path: packages/vscode/*.vsix

  # -------------------------------------------------------------
  # 2. Desktop Applications (Windows, macOS Silicon/Intel, Linux)
  # -------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.platform-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-name: Windows-x64
            target-arch: x64
            artifact-pattern: 'packages/electron/dist/OpencodeSilver-*-win-x64.exe*'
          - os: macos-latest # Apple Silicon (M1/M2/M3)
            platform-name: macOS-AppleSilicon-arm64
            target-arch: arm64
            artifact-pattern: 'packages/electron/dist/OpencodeSilver-*-mac-arm64.*'
          - os: macos-15-intel # Intel x64 (macos-13 runners are retired)
            platform-name: macOS-Intel-x64
            target-arch: x64
            artifact-pattern: 'packages/electron/dist/OpencodeSilver-*-mac-x64.*'
          - os: ubuntu-latest
            platform-name: Linux-x64
            target-arch: x64
            artifact-pattern: 'packages/electron/dist/OpencodeSilver-*-linux-x64.*'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare OpenCode CLI Sidecar
        run: bun run --cwd packages/electron prepare:opencode-cli
        env:
          OPENCODESILVER_TARGET_ARCH: ${{ matrix.target-arch }}

      - name: Build Core Engine
        run: bun run --cwd packages/core build

      - name: Build Web Assets
        run: bun run --cwd packages/electron build:web-assets

      - name: Bundle Electron Main Process
        run: bun run --cwd packages/electron bundle:main

      - name: Rebuild Native Modules
        run: bun run --cwd packages/electron rebuild:native
        env:
          OPENCODESILVER_TARGET_ARCH: ${{ matrix.target-arch }}

      - name: Package Desktop Binary
        run: |
          cd packages/electron
          node ./scripts/package.mjs --publish never
        env:
          OPENCODESILVER_TARGET_ARCH: ${{ matrix.target-arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Core Engine inside app.asar
        shell: bash
        run: |
          ASAR_PATH=$(find packages/electron/dist -name "app.asar" | head -n 1)
          if [ -z "$ASAR_PATH" ]; then
            echo "Error: app.asar not found in packages/electron/dist"
            exit 1
          fi
          echo "Checking $ASAR_PATH for @opencodesilver/core/dist/index.js..."
          # asar prints backslash-separated paths on Windows; normalize first.
          npx --yes @electron/asar list "$ASAR_PATH" | tr '\\' '/' | grep -F "node_modules/@opencodesilver/core/dist/index.js"

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeSilver-Desktop-${{ matrix.platform-name }}
          path: ${{ matrix.artifact-pattern }}

  # -------------------------------------------------------------
  # 3. Android Application (APK)
  # -------------------------------------------------------------
  build-android:
    name: Build Android App (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and dependencies
        run: bun run build:deps

      - name: Build Core Engine
        run: bun run --cwd packages/core build

      - name: Build Web Assets for Mobile
        run: |
          bun run --cwd packages/web build
          node packages/mobile/scripts/prepare-web-assets.mjs

      - name: Sync Capacitor Android
        run: |
          cd packages/mobile
          npx cap sync android

      - name: Build Android APK
        run: |
          cd packages/mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK with Version
        run: |
          mkdir -p dist-apk
          VERSION=$(node -p "require('./package.json').version")
          cp packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/OpencodeSilver-${VERSION}-android-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeSilver-Android-APK
          path: dist-apk/*.apk

  # -------------------------------------------------------------
  # 3b. iOS App Simulator Build
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and dependencies
        run: bun run build:deps

      - name: Build Core Engine
        run: bun run --cwd packages/core build

      - name: Build Web Assets for Mobile
        run: |
          bun run --cwd packages/web build
          node packages/mobile/scripts/prepare-web-assets.mjs

      - name: Sync Capacitor iOS
        run: |
          cd packages/mobile
          npx cap sync ios

      - name: Build iOS Simulator App
        run: |
          cd packages/mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeSilver-iOS-App
          path: packages/mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app

  # -------------------------------------------------------------
  # 4. Publish Release (When tagged or requested)
  # -------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-vscode, build-desktop, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets and Checksums
        run: |
          mkdir -p final-assets
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.vsix" -o -name "*.apk" -o -name "*.blockmap" -o -name "*.yml" \) -exec cp {} final-assets/ \;
          ls -la final-assets/
          VERSION=$(node -p "require('./package.json').version")
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          
          # Generate cryptographic SHA-256 checksums for artifact integrity
          cd final-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file final-assets/opencode-silver-sbom.cdx.json || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          name: OpencodeSilver ${{ github.ref_name }}
          body: |
            ## OpencodeSilver Release ${{ github.ref_name }}
            
            Official release distribution for **OpencodeSilver** (v${{ env.RELEASE_VERSION }}).
            
            ### Included Binaries:
            - **Windows**: `OpencodeSilver-${{ env.RELEASE_VERSION }}-win-x64.exe` (Installer)
            - **macOS Apple Silicon**: `OpencodeSilver-${{ env.RELEASE_VERSION }}-mac-arm64.dmg` (M1/M2/M3/M4)
            - **macOS Intel**: `OpencodeSilver-${{ env.RELEASE_VERSION }}-mac-x64.dmg`
            - **Linux**: `OpencodeSilver-${{ env.RELEASE_VERSION }}-linux-x64.AppImage`
            - **VS Code Extension**: `opencodesilver-${{ env.RELEASE_VERSION }}.vsix`
            - **Android App**: `OpencodeSilver-${{ env.RELEASE_VERSION }}-android-debug.apk`
            
            ### 🔐 Integrity & Verification:
            - **SHA-256 Hashes**: Available in `SHA256SUMS.txt`
            - **Software Bill of Materials (SBOM)**: Available in `opencode-silver-sbom.cdx.json`
            - For automated and manual code signing instructions across platforms, see [CODE_SIGNING.md](docs/CODE_SIGNING.md).
            
            *Authored and developed exclusively by **Ahmed (GEMTM)** under the **OpencodeSilver Proprietary Software License (OSSL-1.0)**.*
          draft: false
          prerelease: false
