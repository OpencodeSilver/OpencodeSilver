<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      color: #111111;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color: #f5f5f5;
      }
    }
  </style>
  <!-- OpencodeSilver logo - simplified for favicon -->
  <g transform="translate(16, 16) scale(0.48)">
    <!-- Left face - with fill -->
    <path d="M0 0 L-26 -15 L-26 15 L0 30 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right face - with fill -->
    <path d="M0 0 L26 -15 L26 15 L0 30 Z" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- Top face - open -->
    <path d="M0 -30 L-26 -15 L0 0 L26 -15 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- Infinity logo on top face -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, -15) rotate(-45) scale(0.9)">
      <path d="M 0 0 c -2 -2.67 -4 -4 -6 -4 a 4 4 0 1 0 0 8 c 2 0 4 -1.33 6 -4 Z m 0 0 c 2 2.67 4 4 6 4 a 4 4 0 0 0 0 -8 c -2 0 -4 1.33 -6 4 Z" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
